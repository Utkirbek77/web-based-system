<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - My Hobbies</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 320px;
        }

        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }

        li {
            background: #eef2f7;
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            color: #333;
            font-weight: 500;
        }

        nav a {
            color: #3498db;
            text-decoration: none;
            font-weight: 600;
            margin: 0 8px;
        }

        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>My Hobbies</h1>
        <ul>
            {% for hobby in hobbies %}
            <li>{{ hobby }}</li>
            {% endfor %}
        </ul>
        <nav>
            <a href="/">Home</a> |
            <a href="/profile">Profile</a> |
            <a href="/greet/Utkirbek">Greet</a>
        </nav>
    </div>
</body>

</html>
